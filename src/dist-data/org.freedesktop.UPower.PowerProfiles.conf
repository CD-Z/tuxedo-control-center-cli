<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>
    <type>system</type>
    <policy user="root">
        <allow own="org.freedesktop.UPower.PowerProfiles" />
        <allow send_type="method_return" />
        <allow send_type="error" />
        <allow send_type="signal" send_path="/org/freedesktop/UPower/PowerProfiles" send_interface="org.freedesktop.DBus.Properties" send_member="PropertiesChanged" />
        <allow send_type="signal" send_path="/org/freedesktop/UPower/PowerProfiles" send_interface="org.freedesktop.UPower.PowerProfiles" send_member="ProfileReleased" />
    </policy>
    <policy context="default">
        <allow send_destination="org.freedesktop.UPower.PowerProfiles" send_path="/org/freedesktop/UPower/PowerProfiles" send_interface="org.freedesktop.UPower.PowerProfiles" />
        <allow send_destination="org.freedesktop.UPower.PowerProfiles" send_path="/org/freedesktop/UPower/PowerProfiles" send_interface="org.freedesktop.DBus.Properties" />
        <allow send_destination="org.freedesktop.UPower.PowerProfiles" send_path="/org/freedesktop/UPower/PowerProfiles" send_interface="org.freedesktop.DBus.Introspectable" />
        <allow send_destination="org.freedesktop.UPower.PowerProfiles" send_path="/org/freedesktop/UPower/PowerProfiles" send_interface="org.freedesktop.DBus.Peer" />
        <allow receive_sender="org.freedesktop.UPower.PowerProfiles" receive_path="/org/freedesktop/UPower/PowerProfiles" receive_interface="org.freedesktop.DBus.Properties" receive_member="PropertiesChanged" />
        <allow receive_sender="org.freedesktop.UPower.PowerProfiles" receive_path="/org/freedesktop/UPower/PowerProfiles" receive_interface="org.freedesktop.UPower.PowerProfiles" receive_member="ProfileReleased" />
    </policy>
</busconfig>
